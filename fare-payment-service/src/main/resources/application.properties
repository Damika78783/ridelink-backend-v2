# ==============================================================================
# Application Configuration: Fare & Payment Service
# ==============================================================================
spring.application.name=fare-payment-service
server.port=${SERVER_PORT:8084}

# ==============================================================================
# Database Configuration (PostgreSQL with Environment Variable Overrides)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fare_payment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# JWT Security Configuration
# Secret key is injected via JWT_SECRET environment variable (default fallback provided for dev)
# ==============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==============================================================================
# Fare Pricing Parameters (Configurable per environment)
# ==============================================================================
fare.base-fare=150.00
fare.per-km-rate=80.00
fare.per-min-rate=5.00
fare.minimum-fare=200.00

# Vehicle Type Multipliers
fare.multipliers.car=1.2
fare.multipliers.van=1.5
fare.multipliers.tuktuk=1.0
fare.multipliers.bike=0.8

# ==============================================================================
# External Microservices Integration
# ==============================================================================
services.ride-service.base-url=${RIDE_SERVICE_URL:http://localhost:8083}

# ==============================================================================
# OpenAPI / Swagger Documentation UI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
