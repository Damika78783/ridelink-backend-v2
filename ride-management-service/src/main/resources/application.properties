spring.application.name=ride-management-service
server.port=${SERVER_PORT:8083}

# Ride Management Service owns this database. Do not reuse another service's schema.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridelink_ride_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Must be identical to the JWT_SECRET used by Account Service.
jwt.secret=${JWT_SECRET}
