# ===================================================================
# RideLink – Driver & Vehicle Microservice Configuration (Member 2)
# ===================================================================

# Server Port (Member 1: 8081, Member 2: 8082, Member 3: 8083, Member 4: 8084)
server.port=8082

# Application Name
spring.application.name=driver-vehicle-service

# MongoDB Persistence Boundary (Independent database for Driver & Vehicle Service)
# In production/deployment, set the MONGODB_URI environment variable.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_driver_db}
spring.data.mongodb.auto-index-creation=true

# Security Configuration
ridelink.security.jwt.enabled=${JWT_SECURITY_ENABLED:false}
ridelink.security.jwt.secret=${JWT_SECRET:RideLinkSuperSecretKeyForSigningTokensMustBeAtLeast256BitsLong!}

# Springdoc OpenAPI & Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# Logging Configuration
logging.level.com.ridelink.drivervehicle=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
